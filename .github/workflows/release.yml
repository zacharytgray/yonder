name: release

on:
  push:
    tags: ["v*"]

# actions are pinned by commit sha, tag in the comment; dependabot bumps them.
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN publishes the github release.
    # TAP_DEPLOY_KEY is the private half of a write deploy key on zacharytgray/homebrew-yonder.
    # id-token and attestations sign the build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1 # exact; dependabot does not bump this, so update it by hand
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      # provenance for each archive: gh attestation verify <archive> --repo zacharytgray/yonder
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
