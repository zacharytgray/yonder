version: 2
project_name: yonder

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/yonder
    binary: yonder
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/zacharytgray/yonder/internal/version.Version={{.Version}}

# install.sh builds these names by hand; keep them in sync
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# homebrew_casks replaces brews (deprecated since goreleaser v2.16, casks cover linuxbrew too)
homebrew_casks:
  - name: yonder
    binaries:
      - yonder
    repository:
      owner: zacharytgray
      name: homebrew-tap
      # needs a pat with write access to the tap; GITHUB_TOKEN can't push to another repo
      # token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/zacharytgray/yonder
    description: Connect your own machines so the agents on any of them can use all of them
    # the tap repo doesn't exist yet; flip to false (or remove) once it does
    skip_upload: true
    caveats: |
      next: run `yonder init` to set up this machine.
    # binaries are not notarized, so drop the quarantine flag on macos
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/yonder"]
          end
