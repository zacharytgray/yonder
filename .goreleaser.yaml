version: 2
project_name: yonder

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/yonder
    binary: yonder
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/zacharytgray/yonder/internal/version.Version={{.Version}}

# signs the darwin binaries with the developer id cert and notarizes them with apple (quill,
# so it runs on linux). bare binaries can't be stapled; gatekeeper checks the ticket online.
# off when the secrets are absent (pull request snapshots); release.yml requires them.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

# install.sh builds these names by hand; keep them in sync
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# release.yml publishes the draft once a mac runner has checked the signatures
release:
  draft: true

# homebrew_casks replaces brews (deprecated since goreleaser v2.16, casks cover linuxbrew too)
homebrew_casks:
  - name: yonder
    binaries:
      - yonder
    repository:
      owner: zacharytgray
      name: homebrew-yonder
      branch: main
    homepage: https://github.com/zacharytgray/yonder
    description: Connect your own machines so the agents on any of them can use all of them
    # goreleaser only writes dist/homebrew/Casks/yonder.rb. release.yml pushes it to the tap
    # after the mac check has published the release, so the cask never points at a draft.
    skip_upload: true
    caveats: |
      next: run `yonder init` to set up this machine.
